<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Guarantee React Fast Refresh preamble hooks exist before any component modules evaluate
      window.$RefreshReg$ = window.$RefreshReg$ || function () {};
      window.$RefreshSig$ = window.$RefreshSig$ || function () { return function (type) { return type; }; };

      // Gracefully handle harmless Vite HMR WebSocket connection drops in preview iframe
      window.addEventListener('unhandledrejection', function (e) {
        if (e && e.reason && (
          (typeof e.reason.message === 'string' && e.reason.message.includes('WebSocket')) ||
          (typeof e.reason === 'string' && e.reason.includes('WebSocket'))
        )) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function (e) {
        if (e && (
          (typeof e.message === 'string' && e.message.includes('WebSocket')) ||
          (e.error && typeof e.error.message === 'string' && e.error.message.includes('WebSocket'))
        )) {
          e.preventDefault();
        }
      });
    </script>
    <title>سراج - تايمر، مهام أسبوعية وتتبع الصلاة</title>
